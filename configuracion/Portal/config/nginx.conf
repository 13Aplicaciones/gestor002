events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
            
        location / {
            root /var/www/html;
            index index.html index.htm;
        }

        #
        # Manager de microservicios
        # manager => http://localhost:8100/applications se debe reemplazar por la url del front-end
        location /manager/ {            
            proxy_pass http://manager:8100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }

        #
        # Ejemplo para configurar un proxy inverso para los servicios spring boot
        # gestor-ws => http://localhost:8090/gestor-ws/ se debe reemplazar por la url del servicio
        # 
        # reprisar para cada servicio
        location /gestor-ws/ {            
            proxy_pass http://localhost:8090/gestor-ws/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }

        location /seguridades-ws/ {            
            proxy_pass http://localhost:8092/seguridades-ws/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }

        #
        # Keycloak -- realms
        location /realms/ {            
            proxy_pass http://keycloak:8080/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }

        #
        # Keycloak -- admin
        location /admin/ {            
            proxy_pass http://keycloak:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }

        #
        # Keycloak -- resources
        location /resources/ {            
            proxy_pass http://keycloak:8080/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30;
            proxy_connect_timeout 30;
        }
    }
}